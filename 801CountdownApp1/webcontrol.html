<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>801 倒计时控制</title>
<style>
*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
  color-scheme: light dark;
  --color-black: #000000;
  --color-dark: #1a1a1a;
  --color-gray-dark: #2d2d2d;
  --color-gray: #666666;
  --color-gray-light: #999999;
  --color-light: #e0e0e0;
  --color-white: #ffffff;
  --color-accent: #333333;
  --color-surface-2: #f2f2f2;
  --color-placeholder: #e6e6e6;
  --login-scrim: rgba(255, 255, 255, .96);

  --spacing-xs: 0.5rem;
  --spacing-sm: 0.75rem;
  --spacing-md: 1rem;
  --spacing-lg: 1.5rem;
  --spacing-xl: 2rem;

  --transition-fast: 0.15s ease;
  --transition-normal: 0.3s ease;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
  margin: 0; padding: 10px; background: var(--color-white); color: var(--color-black);
  display: flex; justify-content: center; min-height: 100vh;
}
.container { width: 100%; max-width: 480px; padding-bottom: 32px; }

/* ── 卡片 ── */
.card {
  border: 2px solid var(--color-black);
  background: var(--color-white);
  padding: 16px 18px;
  margin-bottom: 12px;
  transition: var(--transition-normal);
}
.card:hover {
  box-shadow: 6px 6px 0 var(--color-black);
  transform: translate(-3px, -3px);
}
.card-title {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--color-gray);
  margin: 0 0 12px 0;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--color-light);
}

/* ── 顶部导航栏 ── */
.topnav {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  height: 48px;
  padding: 0 8px 0 16px;
  background: var(--color-white);
  border: 2px solid var(--color-black);
  margin-bottom: 12px;
}
.topnav-title { flex: 1; font-size: 20px; font-weight: 900; letter-spacing: 3px; color: var(--color-black); }
.menu-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; padding: 0;
  border: 2px solid var(--color-black); background: var(--color-white);
  cursor: pointer; transition: var(--transition-fast);
}
.menu-btn:hover { background: var(--color-black); }
.menu-btn:hover svg rect { fill: var(--color-white); }
.menu-panel {
  position: absolute; top: 100%; right: 0; z-index: 30;
  display: none; min-width: 150px;
  background: var(--color-white); border: 2px solid var(--color-black);
  box-shadow: 6px 6px 0 var(--color-black);
}
.menu-panel.show { display: block; }
.menu-item {
  display: block; width: 100%; padding: 10px 16px;
  border: none; background: none; text-align: left;
  font-size: 13px; font-weight: 700; letter-spacing: 1px;
  color: var(--color-black); cursor: pointer;
}
.menu-item:hover:not(:disabled) { background: var(--color-black); color: var(--color-white); }
.menu-item:disabled { color: var(--color-gray-light); cursor: not-allowed; }

/* ── 文档预览 ── */
.preview-overlay { position: fixed; inset: 0; z-index: 95; background: rgba(0, 0, 0, .55); display: none; }
.preview-overlay.show { display: block; }
.preview-panel {
  position: absolute; inset: 10px; background: var(--color-white);
  border: 2px solid var(--color-black); display: flex; flex-direction: column;
}
.preview-head {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 12px; border-bottom: 2px solid var(--color-black); flex-shrink: 0;
}
.preview-head-title { flex: none; font-size: 13px; font-weight: 900; letter-spacing: 2px; }
.preview-close { margin-left: auto; }
.preview-progress { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.preview-progress-track {
  width: 100px; height: 8px; border: 1px solid var(--color-black);
  background: var(--color-white);
}
.preview-progress-bar { height: 100%; width: 0; background: var(--color-black); transition: width .2s linear; }
.preview-progress-value {
  font-size: 11px; font-weight: 700; letter-spacing: 0.5px;
  color: var(--color-gray); white-space: nowrap;
}
@media (max-width: 420px) {
  .preview-progress-track { width: 56px; }
  .preview-progress-value { font-size: 10px; }
}
.preview-status {
  display: none; width: 10px; height: 10px; border-radius: 50%;
  background: #b5b5b5; border: 1px solid var(--color-black); flex: none;
}
.preview-panel.podium .preview-status { display: inline-block; }
.preview-status.online { background: #19b45c; }
.preview-status.offline { background: #e02b2b; }
.preview-status-text {
  display: none; font-size: 11px; font-weight: 700; letter-spacing: 1px;
  white-space: nowrap; color: var(--color-black);
}
.preview-panel.podium .preview-status-text.show { display: inline; }
.preview-podium { display: flex; align-items: center; gap: 8px; flex: none; }
.preview-podium-label { font-size: 11px; font-weight: 700; letter-spacing: 1px; white-space: nowrap; }
@media (max-width: 520px) {
  .preview-head { gap: 6px; }
  .preview-podium { gap: 6px; min-width: 0; }
  .preview-podium-label { font-size: 9px; letter-spacing: 0; overflow: hidden; text-overflow: ellipsis; }
  .preview-progress-track { width: 40px; }
  .preview-status-text { font-size: 9px; letter-spacing: 0; }
}
@media (max-width: 560px) {
  .preview-panel.podium:has(.preview-status-text.show) .preview-head-title { display: none; }
}
.preview-close {
  width: 30px; height: 30px; padding: 0;
  display: inline-flex; align-items: center; justify-content: center;
  border: 2px solid var(--color-black); background: var(--color-white); cursor: pointer;
}
.preview-close:hover { background: var(--color-black); }
.preview-close:hover svg line { stroke: var(--color-white); }
.preview-body { flex: 1; overflow: auto; padding: 12px; background: var(--color-surface-2); }
.preview-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 14px; align-content: start;
}
.preview-page { min-width: 0; }
.preview-thumb {
  position: relative; min-height: 90px;
  background: var(--color-placeholder); border: 1px solid var(--color-gray-light);
}
.preview-thumb img {
  display: block; width: 100%; height: auto;
  background: var(--color-white);
}
.preview-caption { font-size: 11px; font-weight: 700; letter-spacing: 1px; color: var(--color-gray); margin: 0 0 4px; }
.preview-page.current .preview-thumb {
  position: relative; z-index: 4;
  border-color: transparent;
}
.preview-page.current .preview-caption { color: var(--color-black); }
.preview-panel.podium .preview-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 22px; }
.preview-panel.podium .preview-caption { display: none; }
.preview-panel.podium .preview-thumb { cursor: pointer; }
.preview-panel.podium .preview-page.current .preview-thumb::after { inset: -10px; }
.preview-page.current .preview-thumb::after {
  content: '';
  position: absolute;
  inset: -3px;
  pointer-events: none;
  background:
    linear-gradient(#2f7bff, #2f7bff) left top / 26px 5px no-repeat,
    linear-gradient(#2f7bff, #2f7bff) left top / 5px 26px no-repeat,
    linear-gradient(#2f7bff, #2f7bff) right top / 26px 5px no-repeat,
    linear-gradient(#2f7bff, #2f7bff) right top / 5px 26px no-repeat,
    linear-gradient(#2f7bff, #2f7bff) left bottom / 26px 5px no-repeat,
    linear-gradient(#2f7bff, #2f7bff) left bottom / 5px 26px no-repeat,
    linear-gradient(#2f7bff, #2f7bff) right bottom / 26px 5px no-repeat,
    linear-gradient(#2f7bff, #2f7bff) right bottom / 5px 26px no-repeat;
}
.disconnect-banner { align-items: center; justify-content: center; gap: 8px; }
.disconnect-dot {
  width: 12px; height: 12px; border-radius: 50%;
  background: #e02b2b; border: 1px solid var(--color-black); flex: none;
}
.preview-loading, .preview-message {
  text-align: center; padding: 32px 12px;
  font-size: 13px; font-weight: 700; letter-spacing: 1px; color: var(--color-gray);
}
.zoom-overlay {
  position: fixed; inset: 0; z-index: 105; display: none;
  align-items: center; justify-content: center;
  background: rgba(0, 0, 0, .85);
}
.zoom-overlay.show { display: flex; }
.zoom-overlay img { max-width: 94vw; max-height: 90vh; display: block; background: #fff; }
.zoom-close {
  position: absolute; top: 14px; right: 14px;
  width: 40px; height: 40px; padding: 0;
  display: inline-flex; align-items: center; justify-content: center;
  border: 2px solid #fff; background: transparent; cursor: pointer;
}
.zoom-close:hover { background: #fff; }
.zoom-close:hover svg line { stroke: #000; }
.zoom-follow {
  position: absolute; top: 14px; left: 14px;
  padding: 8px 16px; border: 2px solid #fff; background: transparent;
  color: #fff; font-family: inherit; font-size: 12px; font-weight: 700;
  letter-spacing: 1px; cursor: pointer;
}
.zoom-follow.active { background: #fff; color: #000; }
.thumb-menu {
  position: fixed; z-index: 106; min-width: 130px; display: none;
  background: var(--color-white); border: 2px solid var(--color-black); box-shadow: 6px 6px 0 rgba(0, 0, 0, .25);
}
.thumb-menu.show { display: block; }
.thumb-menu button {
  display: block; width: 100%; padding: 9px 14px; text-align: left;
  border: 0; background: var(--color-white); color: var(--color-black);
  font-family: inherit; font-size: 12px; font-weight: 700; letter-spacing: 1px; cursor: pointer;
}
.thumb-menu button:hover { background: var(--color-black); color: var(--color-white); }

/* ── 翻页笔 ── */
.presenter {
  position: fixed; inset: 0; z-index: 108; display: none;
  flex-direction: column; background: var(--color-white);
  padding: calc(12px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
  user-select: none; -webkit-user-select: none;
}
.presenter.show { display: flex; }
.presenter-head { display: flex; align-items: center; gap: 12px; flex: none; }
.presenter-status {
  width: 12px; height: 12px; border-radius: 50%;
  background: #b5b5b5; border: 1px solid var(--color-black); flex: none;
}
.presenter-status.online { background: #19b45c; }
.presenter-status.offline { background: #e02b2b; }
.presenter-back {
  width: 36px; height: 36px; padding: 0; flex: none;
  display: inline-flex; align-items: center; justify-content: center;
  border: 2px solid var(--color-black); background: var(--color-white); cursor: pointer;
}
.presenter-title { font-size: 14px; font-weight: 900; letter-spacing: 2px; }
.presenter-counter { margin-left: auto; font-family: "Courier New", monospace; font-size: 14px; font-weight: 700; }
.presenter-body {
  flex: 1; min-height: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; touch-action: pan-y;
}
.presenter-pagenum { font-size: 72px; font-weight: 200; line-height: 1; letter-spacing: 2px; }
.presenter-preview {
  margin-top: 14px; border: 2px solid var(--color-black); background: var(--color-surface-2);
  display: none; overflow: hidden; line-height: 0;
}
.presenter-preview.show { display: block; }
.presenter-preview img {
  display: block; width: auto; height: auto;
  max-width: min(70vw, 420px); max-height: 30vh;
}
.presenter-hint { margin-top: 10px; min-height: 18px; font-size: 12px; letter-spacing: 1px; color: var(--color-gray); text-align: center; }
.presenter-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; flex: none; }
.presenter-btn {
  height: 132px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 8px; border: 2px solid var(--color-black); background: var(--color-white); color: var(--color-black);
  font-family: inherit; font-size: 16px; font-weight: 900; letter-spacing: 2px;
  cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: manipulation;
}
.presenter-btn:active { background: var(--color-black); color: var(--color-white); }
.presenter-btn:active svg path { stroke: var(--color-white); }
.presenter-btn:disabled { opacity: .35; cursor: not-allowed; }
.presenter-extra { margin-top: 14px; display: flex; flex-direction: column; gap: 10px; flex: none; }
.presenter-mode {
  display: inline-flex; margin-top: 10px; flex: none; align-self: flex-start;
  border: 2px solid var(--color-black); background: var(--color-white);
}
.presenter-mode button {
  padding: 6px 18px; border: 0; border-left: 2px solid var(--color-black);
  background: var(--color-white); color: var(--color-black);
  font-family: inherit; font-size: 12px; font-weight: 900; letter-spacing: 2px;
  cursor: pointer; user-select: none; -webkit-user-select: none;
}
.presenter-mode button:first-child { border-left: 0; }
.presenter-mode button.active { background: var(--color-black); color: var(--color-white); }
.presenter-jump { display: flex; gap: 10px; }
.presenter-jump input {
  flex: 1; min-width: 0; padding: 10px 12px;
  border: 2px solid var(--color-black); background: var(--color-white); color: var(--color-black);
  font-family: inherit; font-size: 16px; outline: none;
}
.presenter-jump .btn { flex: none; min-width: 92px; }
.presenter-tools { display: grid; grid-template-columns: 1fr; gap: 10px; }
.presenter-tools .btn { width: 100%; }

/* ── 头部 ── */
.header { text-align: center; padding: 0 0 14px 0; }
.header h1 { margin: 0; font-size: 20px; font-weight: 900; letter-spacing: 4px; text-transform: uppercase; }
.header p { margin: 6px 0 0 0; font-size: 12px; color: var(--color-gray); letter-spacing: 1px; text-transform: uppercase; }
.host-info { margin: 2px 0 0 0; font-size: 11px; color: var(--color-gray-light); letter-spacing: 0.5px; font-family: "Courier New", monospace; font-weight: 700; }
.fg-info { margin: 2px 0 0 0; font-size: 10px; color: var(--color-gray-light); letter-spacing: 0.3px; font-family: "Courier New", monospace; font-weight: 700; word-break: break-all; }

/* ── 计时器显示 ── */
.timer-display { text-align: center; padding: 8px 0 8px 0; }
.timer-display .time {
  font-size: 52px;
  font-weight: 300;
  letter-spacing: 4px;
  font-variant-numeric: tabular-nums;
  line-height: 1.1;
  color: var(--color-black);
  margin: 0;
}
.timer-display .state-badge {
  display: inline-block;
  font-size: 12px;
  font-weight: 700;
  padding: 3px 14px;
  border: 2px solid var(--color-black);
  margin-top: 6px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
.state-badge.running { background: var(--color-black); color: var(--color-white); }
.state-badge.paused { background: var(--color-white); color: var(--color-black); }
.state-badge.stopped { background: var(--color-black); color: var(--color-white); }

/* ── 进度条 ── */
.progress-wrap { padding: 4px 0 2px 0; }
.progress-bar { height: 8px; background: var(--color-light); border: 1px solid var(--color-black); }
.progress-fill { height: 100%; width: 100%; background: var(--color-black); transition: width .5s linear; }
.progress-label { text-align: center; font-size: 12px; color: var(--color-gray); margin-top: 4px; letter-spacing: 0.5px; }
.slide-info-row { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--color-light); font-size: 13px; font-weight: 700; letter-spacing: 1px; color: var(--color-black); }
.slide-info-icon { margin-right: 4px; font-size: 10px; }
.slide-progress-wrap { margin-top: 4px; padding: 0 4px; }
.slide-progress-bar { height: 4px; background: var(--color-light); border: none; }
.slide-progress-fill { height: 100%; width: 0%; background: var(--color-gray); transition: width .3s linear; }
.slide-progress-label { text-align: center; font-size: 10px; color: var(--color-gray-light); margin-top: 2px; letter-spacing: 0.5px; }

/* ── 按钮 ── */
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 10px 20px;
  border: 2px solid var(--color-black);
  background: var(--color-white);
  color: var(--color-black);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: var(--transition-fast);
  min-width: 72px;
  flex: 1 0 auto;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
.btn:hover:not(:disabled) { background: var(--color-black); color: var(--color-white); }
.btn:active:not(:disabled) { transform: scale(.96); }
.btn:disabled { opacity: .35; cursor: not-allowed; border-color: var(--color-gray-light); color: var(--color-gray-light); }
.btn-start { background: var(--color-black); color: var(--color-white); }
.btn-start:hover:not(:disabled) { background: var(--color-dark); }
.btn-sm { padding: 8px 14px; font-size: 12px; min-width: 56px; flex: 0 1 auto; }

/* ── 时间设定 ── */
.time-set-body { padding: 2px 0; }
.time-input-group {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}
.time-input-group input {
  width: 90px;
  padding: 9px 12px;
  border: 2px solid var(--color-black);
  font-size: 22px;
  font-weight: 700;
  text-align: center;
  outline: none;
  transition: var(--transition-fast);
  color: var(--color-black);
  background: var(--color-white);
}
.time-input-group input:focus { background: var(--color-black); color: var(--color-white); }
.time-input-group input:disabled { opacity: .35; border-color: var(--color-gray-light); color: var(--color-gray-light); }
.time-input-group input:disabled:focus { background: var(--color-white); color: var(--color-gray-light); }
.time-unit { font-size: 15px; color: var(--color-gray); font-weight: 700; letter-spacing: 0.5px; }
.time-input-group .btn { flex: 0 0 auto; padding: 9px 24px; }

.preset-section { margin-bottom: 8px; }
.preset-label { font-size: 12px; color: var(--color-gray); font-weight: 700; margin-bottom: 6px; text-align: center; text-transform: uppercase; letter-spacing: 0.5px; }
.preset-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
.preset-btn {
  padding: 7px 0;
  border: 2px solid var(--color-black);
  background: var(--color-white);
  cursor: pointer;
  font-size: 14px;
  font-weight: 700;
  color: var(--color-black);
  transition: var(--transition-fast);
  text-align: center;
  line-height: 1.3;
}
.preset-btn:hover:not(:disabled) { background: var(--color-black); color: var(--color-white); }
.preset-btn:active:not(:disabled) { transform: scale(.93); }
.preset-btn:disabled { opacity: .35; cursor: not-allowed; border-color: var(--color-gray-light); color: var(--color-gray-light); }

.time-hint { text-align: center; font-size: 11px; color: var(--color-gray); padding: 2px 0 0 0; letter-spacing: 0.5px; }

/* ── 开关 ── */
.toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; }
.toggle-row + .toggle-row { border-top: 1px solid var(--color-light); }
.toggle-row .toggle-label { font-size: 13px; flex: 1; padding-right: 10px; font-weight: 500; }

.toggle { position: relative; width: 44px; height: 22px; flex-shrink: 0; }
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle .slider {
  position: absolute;
  cursor: pointer;
  inset: 0;
  background: var(--color-white);
  border: 2px solid var(--color-black);
  transition: var(--transition-fast);
}
.toggle .slider::before {
  content: '';
  position: absolute;
  height: 12px; width: 12px;
  left: 3px; bottom: 3px;
  background: var(--color-black);
  transition: var(--transition-fast);
}
.toggle input:checked + .slider { background: var(--color-black); }
.toggle input:checked + .slider::before { background: var(--color-white); transform: translateX(20px); }
.toggle input:disabled + .slider,
.toggle input:disabled + .slider::before { opacity: .3; cursor: not-allowed; }
.toggle-row:has(input:disabled) .toggle-label { color: var(--color-gray-light); }

/* ── 透明度滑块 ── */
.slider-row { padding: 6px 0; }
.slider-row .slider-header { display: flex; justify-content: space-between; font-size: 12px; color: var(--color-gray); margin-bottom: 3px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
.slider-row input[type="range"] {
  width: 100%; height: 8px;
  -webkit-appearance: none; appearance: none;
  background: var(--color-light);
  border: 1px solid var(--color-black);
  outline: none;
}
.slider-row input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 20px; height: 20px;
  border: 2px solid var(--color-black);
  background: var(--color-white);
  cursor: pointer;
}
.slider-row input[type="range"]::-webkit-slider-thumb:hover {
  background: var(--color-black);
}

/* ── 窗口位置 ── */
.pos-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
.dpad { display: flex; flex-direction: column; align-items: center; gap: 3px; margin-top: 8px; }
.dpad-row { display: flex; gap: 3px; }
.dpad-btn {
  width: 44px; height: 36px;
  border: 2px solid var(--color-black);
  background: var(--color-white);
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: var(--transition-fast);
  color: var(--color-black);
  font-weight: 700;
}
.dpad-btn:hover { background: var(--color-black); color: var(--color-white); }
.dpad-btn:active { transform: scale(.92); }

/* ── 登录浮层 ── */
.login-overlay {
  position: fixed; inset: 0; z-index: 100;
  display: none; align-items: center; justify-content: center;
  background: var(--login-scrim);
}
.login-overlay.show { display: flex; }
#confirmOverlay { z-index: 120; }
.login-box {
  width: 100%; max-width: 320px; margin: 16px;
  border: 2px solid var(--color-black); background: var(--color-white);
  padding: 24px 22px; box-shadow: 8px 8px 0 var(--color-black);
}
.login-box h2 {
  margin: 0 0 16px 0; font-size: 15px; font-weight: 900;
  letter-spacing: 3px; text-align: center;
}
.login-box input {
  width: 100%; padding: 10px 12px; margin-bottom: 10px;
  border: 2px solid var(--color-black); background: var(--color-white);
  color: var(--color-black); font-size: 16px; outline: none;
  transition: var(--transition-fast);
}
.login-box input:focus { background: var(--color-black); color: var(--color-white); }
.confirm-text {
  margin: 0 0 18px 0; font-size: 13px; line-height: 1.7;
  color: var(--color-gray-dark); word-break: break-all;
}
.login-box .btn { width: 100%; }
.login-box .btn-row .btn { width: auto; flex: 1; }
.login-error { min-height: 18px; margin-top: 8px; font-size: 12px; color: var(--color-gray); text-align: center; }

/* ── 页脚 ── */
.footer { text-align: center; margin-top: 6px; font-size: 11px; color: var(--color-gray); letter-spacing: 0.5px; }
.footer a { color: var(--color-black); text-decoration: none; font-weight: 700; }
.footer a:hover { text-decoration: underline; }

/* ── 锁定按钮 ── */
.lock-btn {
  background: none; border: 2px solid transparent; cursor: pointer;
  font-size: 14px; padding: 2px 6px; transition: var(--transition-fast);
  line-height: 1; color: var(--color-black);
}
.lock-btn:hover { border-color: var(--color-black); }

/* ═══════════════════════════════════════
   响应式
   ═══════════════════════════════════════ */
@media (max-width: 359px) {
  body { padding: 6px; }
  .card { padding: 12px 14px; margin-bottom: 10px; }
  .timer-display .time { font-size: 38px; letter-spacing: 2px; }
  .time-input-group { flex-direction: column; gap: 6px; }
  .time-input-group input { width: 100%; max-width: 160px; }
  .preset-grid { grid-template-columns: repeat(3, 1fr); gap: 4px; }
  .preset-btn { padding: 6px 0; font-size: 13px; }
  .dpad-btn { width: 38px; height: 32px; font-size: 16px; }
  .pos-grid { grid-template-columns: 1fr 1fr; }
}

@media (min-width: 360px) {
  body { padding: 12px; }
  .card { padding: 18px 20px; margin-bottom: 12px; }
  .timer-display .time { font-size: 56px; }
  .preset-grid { grid-template-columns: repeat(4, 1fr); }
}

@media (min-width: 480px) {
  body { padding: 16px; }
  .container { max-width: 500px; }
  .card { padding: 20px 24px; margin-bottom: 14px; }
  .card-title { font-size: 12px; margin-bottom: 14px; }
  .header h1 { font-size: 24px; letter-spacing: 5px; }
  .header p { font-size: 13px; }
  .timer-display .time { font-size: 64px; letter-spacing: 5px; }
  .timer-display .state-badge { font-size: 13px; padding: 4px 16px; }
  .btn { padding: 10px 24px; font-size: 15px; min-width: 80px; }
  .btn-sm { padding: 8px 16px; font-size: 13px; min-width: 60px; }
  .time-input-group { gap: 10px; margin-bottom: 16px; }
  .time-input-group input { width: 100px; font-size: 24px; }
  .time-unit { font-size: 16px; }
  .time-input-group .btn { padding: 10px 28px; }
  .preset-label { font-size: 13px; }
  .preset-grid { gap: 6px; }
  .preset-btn { padding: 8px 0; font-size: 15px; }
  .toggle-row { padding: 7px 0; }
  .toggle-row .toggle-label { font-size: 14px; }
  .slider-row .slider-header { font-size: 13px; }
  .pos-grid { gap: 8px; }
  .dpad-btn { width: 48px; height: 40px; font-size: 20px; }
}

@media (min-width: 640px) {
  body { padding: 24px; }
  .container { max-width: 580px; }
  .card { padding: 24px 32px; margin-bottom: 16px; }
  .card-title { font-size: 13px; letter-spacing: 1.5px; margin-bottom: 16px; }
  .header { padding: 10px 0 4px 0; }
  .header h1 { font-size: 28px; letter-spacing: 6px; }
  .header p { font-size: 14px; }
  .timer-display { padding: 16px 0 12px 0; }
  .timer-display .time { font-size: 80px; letter-spacing: 6px; }
  .timer-display .state-badge { font-size: 14px; padding: 5px 20px; margin-top: 10px; }
  .btn { padding: 12px 28px; font-size: 16px; min-width: 100px; }
  .btn-sm { padding: 9px 18px; font-size: 14px; min-width: 70px; }
  .btn-row { gap: 10px; }
  .time-input-group { gap: 12px; margin-bottom: 20px; }
  .time-input-group input { width: 120px; padding: 11px 14px; font-size: 28px; }
  .time-unit { font-size: 18px; }
  .time-input-group .btn { padding: 11px 32px; font-size: 16px; }
  .preset-label { font-size: 14px; margin-bottom: 8px; }
  .preset-grid { grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .preset-btn { padding: 10px 0; font-size: 16px; }
  .time-hint { font-size: 12px; padding: 6px 0 0 0; }
  .toggle-row { padding: 9px 0; }
  .toggle-row .toggle-label { font-size: 15px; }
  .toggle { width: 48px; height: 26px; }
  .toggle .slider::before { height: 14px; width: 14px; }
  .toggle input:checked + .slider::before { transform: translateX(20px); }
  .slider-row { padding: 10px 0; }
  .slider-row .slider-header { font-size: 14px; }
  .pos-grid { gap: 10px; }
  .dpad { gap: 4px; margin-top: 12px; }
  .dpad-btn { width: 54px; height: 44px; font-size: 22px; }
  .footer { font-size: 13px; margin-top: 10px; }
}

/* ═══════════════════════════════════════
   瀑布流（768以上）
   ═══════════════════════════════════════ */
@media (min-width: 768px) {
  .container {
    max-width: 840px;
    column-count: 2;
    column-gap: 20px;
  }
  .container > .card {
    break-inside: avoid;
    margin-bottom: 18px;
    display: inline-block;
    width: 100%;
  }
  .container > .card:last-of-type { margin-bottom: 0; }
  .header,
  .container > .card:nth-child(2),
  .footer {
    column-span: all;
  }
  .container > .card:nth-child(2) .time {
    font-size: 96px;
    letter-spacing: 10px;
  }
}

@media (min-width: 1024px) {
  .container { max-width: 920px; column-gap: 24px; }
  .container > .card { margin-bottom: 22px; }
  .card { padding: 28px 36px; }
  .header h1 { font-size: 30px; letter-spacing: 8px; }
  .header p { font-size: 15px; }
  .container > .card:nth-child(2) .time { font-size: 110px; }
  .preset-btn { padding: 12px 0; font-size: 18px; }
  .dpad-btn { width: 60px; height: 48px; font-size: 24px; }
}

/* ── 进度条颜色（JS 控制） ── */
.progress-fill.low { background: var(--color-black); }

/* ── 暗色模式 ── */
@media (prefers-color-scheme: dark) {
  :root {
    --color-black: #f0f0f0;
    --color-dark: #d6d6d6;
    --color-gray-dark: #c0c0c0;
    --color-gray: #a0a0a0;
    --color-gray-light: #707070;
    --color-light: #3a3a3a;
    --color-white: #121212;
    --color-accent: #cccccc;
    --color-surface-2: #1a1a1a;
    --color-placeholder: #232323;
    --login-scrim: rgba(0, 0, 0, .92);
  }
  .menu-btn svg rect { fill: var(--color-black); }
  .preview-close svg line,
  .presenter-back svg path,
  .presenter-btn svg path { stroke: var(--color-black); }
  .presenter-btn:active svg path { stroke: var(--color-white); }
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <nav class="topnav">
      <span class="topnav-title">801 倒计时</span>
      <button class="menu-btn" type="button" onclick="toggleMenu(event)" aria-label="菜单">

          <rect width="16" height="2" fill="#000"></rect>
          <rect y="5" width="16" height="2" fill="#000"></rect>
          <rect y="10" width="16" height="2" fill="#000"></rect>
        </svg>
      </button>
      <div class="menu-panel" id="menuPanel">
        <button class="menu-item" type="button" id="menuPresenter" onclick="openPresenter()">翻页笔</button>
        <button class="menu-item" type="button" id="menuDocPreview" onclick="openDocPreview()">文档预览</button>

    <p class="fg-info" id="fgInfo">-</p>

    <span class="disconnect-dot"></span>
    <span>连接断开，正在重连...</span>
  </div>

  <!-- Timer + State -->
  <div class="card" style="padding-bottom:8px;">
    <div id="timerMainArea">
    <div class="timer-display">
      <div class="time" id="timeDisplay">--:--</div>
      <div><span class="state-badge" id="stateBadge">--</span></div>
    </div>
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-label"><span id="progressText">--</span></div>
    </div>
    </div>
    <div id="slideInfoRow" class="slide-info-row" style="display:none;">
      <div style="display:flex;align-items:center;justify-content:center;gap:6px;">
        <span class="slide-info-icon">◆</span>
        <span id="slideInfoText">P0/0</span>
      </div>
      <div class="slide-progress-wrap">
        <div class="slide-progress-bar"><div class="slide-progress-fill" id="slideProgressFill"></div></div>
        <div class="slide-progress-label"><span id="slideProgressText">0%</span></div>
      </div>
    </div>
  </div>

  <!-- Controls -->
  <div class="card" id="controlsCard">
    <div class="card-title" id="titleControls">控制</div>
    <div class="btn-row">
      <button class="btn btn-start" id="btnToggle" onclick="doAction('/toggle')">启动</button>
      <button class="btn" id="btnReset" onclick="doAction('/reset')">重置</button>
    </div>
  </div>

  <!-- Flash + Sound -->
  <div class="card">
    <div class="card-title" id="titleFlashSound">闪烁与响铃</div>
    <div style="display:flex;gap:10px;">
      <button class="btn" id="btnFlash" onclick="doAction('/flash')" style="flex:1;">闪烁窗口</button>
      <button class="btn" id="btnTestSound" onclick="doAction('/testsound')" style="flex:1;">响铃一次</button>
    </div>
  </div>

  <div class="card" id="timeSettingCard">
    <div class="card-title" id="titleTimeSetting">时间设定</div>
    <div class="time-set-body">
      <div class="time-input-group">
        <input type="number" id="inputMinutes" min="1" value="20" disabled>
        <span class="time-unit">MIN</span>
        <button class="btn" id="btnSetTime" disabled onclick="doSetTime()">设定</button>
      </div>
      <div class="preset-section">
        <div class="preset-label">快捷设定</div>
        <div class="preset-grid" id="presetRow">
          <button class="preset-btn" onclick="setMinutes(5, this)">5</button>
          <button class="preset-btn" onclick="setMinutes(10, this)">10</button>
          <button class="preset-btn" onclick="setMinutes(15, this)">15</button>
          <button class="preset-btn" onclick="setMinutes(20, this)">20</button>
          <button class="preset-btn" onclick="setMinutes(30, this)">30</button>
          <button class="preset-btn" onclick="setMinutes(45, this)">45</button>
          <button class="preset-btn" onclick="setMinutes(60, this)">60</button>
        </div>
      </div>
      <div class="time-hint">设定后点击「重置」即可生效</div>
    </div>

  <!-- Presentation -->
  <div class="card" id="presentationCard">

      <button class="btn" id="btnStartShow" onclick="confirmStartShow()" style="flex:1;">全屏放映</button>
      <button class="btn" id="btnCloseShow" onclick="confirmCloseShow()" style="flex:1;">关闭放映软件</button>

  <div class="card">
    <div class="card-title" id="titleSettings">功能开关</div>
    <div class="toggle-row">
      <span class="toggle-label">计时器显示</span>
      <label class="toggle"><input type="checkbox" id="chkShowTimer" onchange="doAction('/setshowtimer')"><span class="slider"></span></label>
    </div>
    <div class="toggle-row">
      <span class="toggle-label">结束时闪烁三次</span>
      <label class="toggle"><input type="checkbox" id="chkFlash3" onchange="doAction('/setflash3')"><span class="slider"></span></label>
    </div>
    <div class="toggle-row">
      <span class="toggle-label">结束时提示音</span>
      <label class="toggle"><input type="checkbox" id="chkSound" onchange="doAction('/togglesound')"><span class="slider"></span></label>
    </div>
    <div class="toggle-row">
      <span class="toggle-label">PPT全屏自动计时</span>
      <label class="toggle"><input type="checkbox" id="chkPptAuto" onchange="doAction('/togglepptauto')"><span class="slider"></span></label>
    </div>
    <div class="toggle-row">
      <span class="toggle-label">显示幻灯片页数</span>
      <label class="toggle"><input type="checkbox" id="chkSlideInfo" onchange="doAction('/toggleslideinfo')"><span class="slider"></span></label>
    </div>
    <div class="toggle-row">
      <span class="toggle-label">计时结束：显示负数</span>
      <label class="toggle"><input type="checkbox" id="chkAllowNegative" onchange="doAction('/toggleallownegative')"><span class="slider"></span></label>
    </div>
    <div class="toggle-row">
      <span class="toggle-label">仅显示文件页数</span>
      <label class="toggle"><input type="checkbox" id="chkPureSlide" onchange="doAction('/togglepureslide');pureSlideToggle(this.checked)"><span class="slider"></span></label>
    </div>
    <div class="slider-row">
      <div class="slider-header">
        <span id="titleOpacity">透明度</span>
        <span style="display:flex;align-items:center;gap:6px;">
          <span id="opacityLabel">100%</span>
          <button id="opacityLockBtn" class="lock-btn" onclick="toggleOpacityLock()" title="锁定/解锁透明度调整">🔒</button>
        </span>
      </div>
      <input type="range" id="opacitySlider" min="100" max="250" value="250" disabled>
    </div>
  </div>

  <!-- Window -->
  <div class="card">
    <div class="card-title" id="titleWindow">窗口</div>
    <div class="slider-row">
      <div class="slider-header">
        <span id="titleFontSize">字号</span>
        <span style="display:flex;align-items:center;gap:6px;">
          <span id="fontSizeLabel">16</span>
          <button id="fontSizeLockBtn" class="lock-btn" onclick="toggleFontSizeLock()" title="锁定/解锁字体大小调整">🔒</button>
        </span>
      </div>
      <input type="range" id="fontSizeSlider" min="8" max="72" value="16" disabled>

        <button class="dpad-btn" id="btnMoveLeft" onclick="doAction('/moveleft')" title="左移">←</button>

<script>
let authRequired = {{needAuth}};

function showLogin() {
  authRequired = true;
  document.getElementById('loginOverlay').classList.add('show');
}

function hideLogin() {
  document.getElementById('loginOverlay').classList.remove('show');
}

function doLogin() {
  const input = document.getElementById('loginPassword');
  const error = document.getElementById('loginError');
  fetch('/login', { method: 'POST', body: input.value }).then(r => {
    if (r.ok) {
      error.textContent = '';
      input.value = '';
      hideLogin();
      updateStatus();
    } else {
      error.textContent = '密码错误';
    }
  }).catch(() => { error.textContent = '连接失败'; });
}

function api(url, opts) {
  return fetch(url, opts).then(r => {
    if (r.status === 401) {
      showLogin();
      const err = new Error('unauthorized');
      err.auth = true;
      throw err;
    }
    return r;
  });
}

function doAction(path) {
  api(path, { method: 'POST' }).catch(() => {});
}

function toggleMenu(ev) {
  if (ev) ev.stopPropagation();
  document.getElementById('menuPanel').classList.toggle('show');
}

function closeMenu() {
  document.getElementById('menuPanel').classList.remove('show');
}

document.addEventListener('click', function (ev) {
  const panel = document.getElementById('menuPanel');
  if (panel.classList.contains('show') && !ev.target.closest('.topnav')) closeMenu();
});

let presenterTimer = null;
let presenterHintUntil = 0;
let presenterShownPage = 0;
let presenterSlideToken = 0;
let presenterSlideObjectUrl = null;

function showPresenterSlide(page) {
  const box = document.getElementById('presenterPreviewBox');
  const img = document.getElementById('presenterPreview');
  if (!page) {
    presenterShownPage = 0;
    presenterSlideToken++;
    box.classList.remove('show');
    if (presenterSlideObjectUrl) {
      URL.revokeObjectURL(presenterSlideObjectUrl);
      presenterSlideObjectUrl = null;
    }
    img.removeAttribute('src');
    return;
  }
  if (page === presenterShownPage) return;
  presenterShownPage = page;
  const token = ++presenterSlideToken;
  fetch('/presenterslide/' + page + '.png', { cache: 'no-store' }).then(r => {
    if (!r.ok) throw new Error('http');
    return r.blob();
  }).then(blob => {
    if (token !== presenterSlideToken) return;
    if (presenterSlideObjectUrl) URL.revokeObjectURL(presenterSlideObjectUrl);
    presenterSlideObjectUrl = URL.createObjectURL(blob);
    img.src = presenterSlideObjectUrl;
    box.classList.add('show');
  }).catch(() => {
    if (token !== presenterSlideToken) return;
    box.classList.remove('show');
  });
}

function setPresenterConnected(online) {
  const dot = document.getElementById('presenterStatus');
  dot.classList.toggle('online', online);
  dot.classList.toggle('offline', !online);
}

function showPresenterHint(text, keepMs) {
  document.getElementById('presenterHint').textContent = text;
  presenterHintUntil = Date.now() + (keepMs || 0);
}

function openPresenter() {
  closeMenu();
  if (lastStatus && lastStatus.permPresentation !== 1) return;
  document.getElementById('presenterPage').classList.add('show');
  setPresenterConnected(true);
  presenterHintUntil = 0;
  presenterShownPage = 0;
  refreshPresenter();
  stopPresenterPoll();
  presenterTimer = setInterval(refreshPresenter, 1000);
}

function closePresenter() {
  stopPresenterPoll();
  document.getElementById('presenterPage').classList.remove('show');
  showPresenterSlide(0);
}

function stopPresenterPoll() {
  if (presenterTimer) {
    clearInterval(presenterTimer);
    presenterTimer = null;
  }
}

function refreshPresenter() {
  api('/slidecurrent').then(r => {
    if (!r.ok) throw new Error('http');
    return r.json();
  }).then(d => {
    setPresenterConnected(true);
    if (d && typeof d.presenterMode === 'number') updatePresenterMode(d.presenterMode);
    const num = document.getElementById('presenterPageNum');
    const counter = document.getElementById('presenterCounter');
    const hint = document.getElementById('presenterHint');
    if (d && d.ok && d.current > 0) {
      num.textContent = d.current;
      counter.textContent = d.total > 0 ? d.current + ' / ' + d.total : String(d.current);
      showPresenterSlide(d.current);
      if (Date.now() > presenterHintUntil) hint.textContent = '';
    } else {
      num.textContent = '-';
      counter.textContent = '- / -';
      showPresenterSlide(0);
      if (Date.now() > presenterHintUntil) hint.textContent = '未在放映';
    }
  }).catch(e => {
    if (e && e.auth) return;
    setPresenterConnected(false);
    showPresenterHint('连接已断开');
  });
}

const presenterQueue = [];
let presenterSending = false;

function presenterRequest(url, body) {
  try { if (navigator.vibrate) navigator.vibrate(12); } catch (e) {}
  // 操作排队依次发送，避免快速连点时请求乱序导致翻页来回跳
  presenterQueue.push({ url: url, body: body });
  if (!presenterSending) pumpPresenterQueue();
}

function pumpPresenterQueue() {
  if (!presenterQueue.length) {
    presenterSending = false;
    if (document.getElementById('presenterPage').classList.contains('show')) {
      setTimeout(refreshPresenter, 120);
    }
    return;
  }
  const item = presenterQueue.shift();
  presenterSending = true;
  api(item.url, { method: 'POST', body: item.body })
    .then(r => r.text().then(text => ({ status: r.status, text: text })))
    .then(res => {
      setPresenterConnected(true);
      let d = null;
      try { d = JSON.parse(res.text); } catch (e) {}
      if (res.status !== 200 || (d && !d.ok)) {
        showPresenterHint((d && d.error) || '操作失败', 2500);
      }
    })
    .catch(e => {
      if (e && e.auth) {
        showLogin();
        presenterQueue.length = 0;
        presenterSending = false;
        return;
      }
      setPresenterConnected(false);
      showPresenterHint('连接已断开');
    })
    .then(() => {
      if (presenterSending) pumpPresenterQueue();
    });
}

function presenterAction(path) {
  presenterRequest('/' + path);
}

function presenterGoto() {
  const input = document.getElementById('presenterGotoInput');
  const n = parseInt(input.value, 10);

    return;
  }
  input.value = '';
  presenterRequest('/gotoslide', String(n));
}

(function () {
  const body = document.getElementById('presenterBody');
  let sx = 0, sy = 0;
  body.addEventListener('touchstart', ev => {
    if (ev.touches.length !== 1) return;
    sx = ev.touches[0].clientX;
    sy = ev.touches[0].clientY;
  }, { passive: true });
  body.addEventListener('touchend', ev => {
    const t = ev.changedTouches[0];
    const dx = t.clientX - sx;
    const dy = t.clientY - sy;
    if (Math.abs(dx) < 60 || Math.abs(dy) > 60) return;
    presenterRequest(dx < 0 ? '/nextslide' : '/prevslide');
  }, { passive: true });
})();

let previewAbort = null;
let previewPollTimer = null;
let zoomSource = null;
let previewSession = '';
let zoomPage = 0;
let zoomFollow = false;
let zoomHd = false;
let zoomHdToken = 0;
let zoomHdUrl = null;

function stopPreviewPoll() {
  if (previewPollTimer) {
    clearInterval(previewPollTimer);
    previewPollTimer = null;
  }
}

function closePreview() {
  if (previewAbort) {
    try { previewAbort.abort(); } catch (e) {}
    previewAbort = null;
  }
  stopPreviewPoll();
  setPreviewConnection(null);
  setPreviewSlideShow(false);
  hideThumbMenu();
  closeZoom();
  document.getElementById('previewOverlay').classList.remove('show');
}

function setPreviewConnection(online) {
  const dot = document.getElementById('previewStatus');
  if (!dot) return;
  dot.classList.remove('online', 'offline');
  if (online === true) dot.classList.add('online');
  else if (online === false) dot.classList.add('offline');
}

function setPreviewSlideShow(on) {
  const el = document.getElementById('previewStatusText');
  if (!el) return;
  el.textContent = on ? '讲台PPT已全屏' : '讲台PPT未全屏';
  el.classList.add('show');
}

function hideThumbMenu() {
  document.getElementById('thumbMenu').classList.remove('show');
}

function showThumbMenu(ev, img, page) {
  ev.preventDefault();
  ev.stopPropagation();
  if (document.querySelector('.preview-panel').classList.contains('podium')) return;
  zoomSource = img.src;
  zoomPage = page;
  const gotoItem = document.getElementById('thumbGoto');
  gotoItem.style.display = (lastStatus && lastStatus.permPresentation === 1) ? '' : 'none';
  const menu = document.getElementById('thumbMenu');
  menu.classList.add('show');
  const mw = menu.offsetWidth;
  const mh = menu.offsetHeight;
  let x = ev.clientX;
  let y = ev.clientY;
  if (x + mw > window.innerWidth - 8) x = window.innerWidth - mw - 8;
  if (y + mh > window.innerHeight - 8) y = window.innerHeight - mh - 8;
  menu.style.left = Math.max(8, x) + 'px';
  menu.style.top = Math.max(8, y) + 'px';
}

function setPreviewProgress(done, total) {
  const bar = document.getElementById('previewProgressBar');
  const value = document.getElementById('previewProgressValue');
  if (!total || total < 1) {
    bar.style.width = '0';
    value.textContent = '-';
    return;
  }
  bar.style.width = Math.min(100, Math.round(done * 100 / total)) + '%';
  value.textContent = done + ' / ' + total;
}

function openZoomAt(hd) {
  if (!zoomSource) return;
  hideThumbMenu();
  zoomFollow = false;
  zoomHd = hd;
  zoomHdToken++;
  document.getElementById('zoomFollow').classList.remove('active');
  const img = document.getElementById('zoomImage');
  img.src = zoomSource;
  document.getElementById('zoomOverlay').classList.add('show');
  if (hd) loadZoomHd(zoomPage);
}

function openZoom() { openZoomAt(false); }
function openZoomHd() { openZoomAt(true); }

function gotoPageFromMenu() {
  hideThumbMenu();
  const page = zoomPage;
  if (!page) return;
  api('/gotoslide', { method: 'POST', body: String(page) }).catch(() => {});
}

function loadZoomHd(page) {
  if (!previewSession || !page) return;
  const token = ++zoomHdToken;
  fetch('/previewhd/' + previewSession + '/' + page + '.png', { credentials: 'same-origin' })
    .then(r => {
      if (r.status === 401) { showLogin(); throw new Error('auth'); }
      if (!r.ok) return r.text().then(t => { throw new Error(t || '加载失败'); });
      return r.blob();
    })
    .then(blob => {
      if (token !== zoomHdToken) return;
      if (zoomHdUrl) URL.revokeObjectURL(zoomHdUrl);
      zoomHdUrl = URL.createObjectURL(blob);
      document.getElementById('zoomImage').src = zoomHdUrl;
    })
    .catch(e => {
      if (e && e.message !== 'auth') alert('高清图加载失败：' + ((e && e.message) || '未知错误'));
    });
}

function closeZoom() {
  zoomHdToken++;
  if (zoomHdUrl) {
    URL.revokeObjectURL(zoomHdUrl);
    zoomHdUrl = null;
  }
  zoomHd = false;
  document.getElementById('zoomOverlay').classList.remove('show');
  document.getElementById('zoomImage').src = '';
}

function toggleZoomFollow(ev) {
  if (ev) ev.stopPropagation();
  zoomFollow = !zoomFollow;
  document.getElementById('zoomFollow').classList.toggle('active', zoomFollow);
}

function downloadImage() {
  if (!previewSession || !zoomPage) return;
  hideThumbMenu();
  const page = zoomPage;
  fetch('/previewhd/' + previewSession + '/' + page + '.png', { credentials: 'same-origin' })
    .then(r => {
      if (r.status === 401) { showLogin(); throw new Error('auth'); }
      if (!r.ok) return r.text().then(t => { throw new Error(t || '下载失败'); });
      return r.blob();
    })
    .then(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = '第' + page + '页.png';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    })
    .catch(e => {
      if (e && e.message !== 'auth') alert('下载失败：' + ((e && e.message) || '未知错误'));
    });
}

document.addEventListener('click', function (ev) {
  if (!ev.target.closest('#thumbMenu')) hideThumbMenu();
});

function openDocPreview() {
  closeMenu();
  if (lastStatus && lastStatus.permDocPreview !== 1) return;
  const body = document.getElementById('previewBody');
  document.getElementById('previewOverlay').classList.add('show');
  fetch('/slidecurrent', { credentials: 'same-origin' })
    .then(r => r.ok ? r.json() : null)
    .then(d => {
      syncPodiumModeFrom(d);
      setPreviewConnection(!!d);
      setPreviewSlideShow(!!d && d.ok && d.current > 0);
    })
    .catch(() => { setPreviewConnection(false); setPreviewSlideShow(false); });
  body.innerHTML = '<div class="preview-loading">正在生成预览…</div>';
  setPreviewProgress(0, 0);
  if (previewAbort) {
    try { previewAbort.abort(); } catch (e) {}
  }
  stopPreviewPoll();
  const controller = new AbortController();
  previewAbort = controller;

  let grid = null;
  const pageEls = {};
  let previewTotal = 0;
  let previewCurrent = 0;
  let previewLoaded = 0;
  let previewDone = false;
  let previewGotoTarget = 0;
  let previewGotoBusy = false;

  function syncZoomToPage(index) {
    if (!zoomFollow) return;
    const overlay = document.getElementById('zoomOverlay');
    if (!overlay.classList.contains('show')) return;
    zoomPage = index;
    if (zoomHd) {
      loadZoomHd(index);
      return;
    }
    const thumb = pageEls[index];
    const img = thumb && thumb.querySelector('img');
    if (!img) return;
    document.getElementById('zoomImage').src = img.src;
  }

  function updateCurrentSlide(index) {
    if (!grid || index < 1 || index > previewTotal) return;
    grid.querySelectorAll('.preview-page.current').forEach(el => el.classList.remove('current'));
    const target = grid.querySelectorAll('.preview-page')[index - 1];
    if (target) target.classList.add('current');
    previewCurrent = index;
    syncZoomToPage(index);
    if (previewDone) setPreviewProgress(index, previewTotal);
  }

  function gotoPreviewPage(page) {
    const panel = document.querySelector('.preview-panel');
    if (!panel.classList.contains('podium')) return;
    // 连续快速点击时只保留最后一个目标，按序执行，避免请求乱序导致来回跳页
    previewGotoTarget = page;
    if (!previewGotoBusy) pumpPreviewGoto();
  }

  function pumpPreviewGoto() {
    if (!previewGotoTarget) { previewGotoBusy = false; return; }
    const page = previewGotoTarget;
    previewGotoTarget = 0;
    previewGotoBusy = true;
    api('/gotoslide', { method: 'POST', body: String(page) })
      .then(r => r.ok ? r.json() : null)
      .then(d => { if (d && d.ok) updateCurrentSlide(page); })
      .catch(() => {})
      .then(pumpPreviewGoto);
  }

  function startPreviewPoll() {
    stopPreviewPoll();
    const tick = () => {
      if (controller.signal.aborted) { stopPreviewPoll(); return; }
      fetch('/slidecurrent', { credentials: 'same-origin' })
        .then(r => r.ok ? r.json() : null)
        .then(d => {
          setPreviewConnection(!!d);
          syncPodiumModeFrom(d);
          setPreviewSlideShow(!!d && d.ok && d.current > 0);
          if (d && d.ok && d.current && !previewGotoBusy) updateCurrentSlide(d.current);
        })
        .catch(() => { setPreviewConnection(false); setPreviewSlideShow(false); });
    };
    tick();
    previewPollTimer = setInterval(tick, 1500);
  }

  function showMessage(text) {
    body.innerHTML = '';
    const msg = document.createElement('div');
    msg.className = 'preview-message';
    msg.textContent = text;
    body.appendChild(msg);
  }

  function handleLine(line) {
    let data;
    try { data = JSON.parse(line); } catch (e) { return; }
    if (data.error) {
      if (!grid) {
        showMessage(data.error);
        setPreviewProgress(0, 0);
      }
      return;
    }
    if (data.done) {
      previewDone = true;
      setPreviewProgress(previewCurrent, previewTotal);
      startPreviewPoll();
      return;
    }
    if (data.total) {
      previewTotal = data.total;
      previewCurrent = data.current;
      previewSession = data.session || '';
      previewLoaded = 0;
      previewDone = false;
      setPreviewProgress(0, previewTotal);
      body.innerHTML = '';
      grid = document.createElement('div');
      grid.className = 'preview-grid';
      body.appendChild(grid);
      for (let n = 1; n <= data.total; n++) {
        const wrap = document.createElement('div');
        wrap.className = 'preview-page' + (n === data.current ? ' current' : '');
        const caption = document.createElement('div');
        caption.className = 'preview-caption';
        caption.textContent = '第 ' + n + ' 页';
        const thumb = document.createElement('div');
        thumb.className = 'preview-thumb';
        thumb.addEventListener('dblclick', () => gotoPreviewPage(n));
        wrap.appendChild(caption);
        wrap.appendChild(thumb);
        grid.appendChild(wrap);
        pageEls[n] = thumb;
      }
      const cur = grid.querySelector('.preview-page.current');
      if (cur) {
        setTimeout(() => {
          if (!controller.signal.aborted) cur.scrollIntoView({ block: 'start' });
        }, 100);
      }
      return;
    }
    if (data.i && data.src && pageEls[data.i] && !pageEls[data.i].firstChild) {
      const img = document.createElement('img');
      img.src = data.src;
      img.alt = '第 ' + data.i + ' 页';
      img.addEventListener('contextmenu', ev => showThumbMenu(ev, img, data.i));
      pageEls[data.i].appendChild(img);
      previewLoaded++;
      setPreviewProgress(previewLoaded, previewTotal);
      if (data.i === previewCurrent) syncZoomToPage(data.i);
    }
  }

  fetch('/preview', { signal: controller.signal, credentials: 'same-origin' }).then(resp => {
    if (resp.status === 401) { const e = new Error('auth'); e.auth = true; throw e; }
    if (resp.status === 403) throw new Error('disabled');
    if (!resp.ok) throw new Error('load');
    if (!resp.body || !resp.body.getReader) {
      return resp.text().then(text => {
        text.split('\n').forEach(l => { if (l.trim()) handleLine(l); });
      });
    }
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    function pump() {
      return reader.read().then(r => {
        if (r.done) {
          if (buffer.trim()) handleLine(buffer);
          return;
        }
        buffer += decoder.decode(r.value, { stream: true });
        let idx;
        while ((idx = buffer.indexOf('\n')) >= 0) {
          const line = buffer.slice(0, idx);
          buffer = buffer.slice(idx + 1);
          if (line.trim()) handleLine(line);
        }
        return pump();
      });
    }
    return pump();
  }).catch(e => {
    if (e && e.name === 'AbortError') return;
    if (e && e.auth) {
      showMessage('需要登录后再预览');
      showLogin();
      return;
    }
    showMessage(e && e.message === 'disabled' ? '文档预览已禁用' : '加载失败');
  });
}

let lastStatus = null;
let confirmAction = null;

function showConfirm(title, text, onAccept, acceptDisabled) {
  document.getElementById('confirmTitle').textContent = title;
  document.getElementById('confirmText').textContent = text;
  document.getElementById('confirmOk').disabled = !!acceptDisabled;
  confirmAction = onAccept;
  document.getElementById('confirmOverlay').classList.add('show');
}

function closeConfirm() {
  document.getElementById('confirmOverlay').classList.remove('show');
  confirmAction = null;
}

function acceptConfirm() {
  const action = confirmAction;
  closeConfirm();
  if (action) action();
}

function confirmStartShow() {
  const app = lastStatus && lastStatus.presentationApp;
  if (app) {
    showConfirm('全屏放映',
      '目标软件：' + app + '。将让该软件进入全屏放映，确认继续？',
      () => doAction('/startshow'));
  } else {
    showConfirm('全屏放映',
      '未检测到正在运行的 PowerPoint 或 WPS 演示，暂时无法开始放映。',
      null, true);
  }
}

function confirmCloseShow() {
  const app = lastStatus && lastStatus.presentationApp;
  if (app) {
    showConfirm('关闭放映软件',
      '目标软件：' + app + '。将强制结束该软件进程，未保存的内容会丢失，确认继续？',
      () => doAction('/closeshow'));
  } else {
    showConfirm('关闭放映软件',
      '未检测到正在运行的 PowerPoint 或 WPS 演示，没有需要关闭的软件。',
      null, true);
  }
}

}

});
document.getElementById('fontSizeSlider').addEventListener('input', function() {
  if (fontSizeLocked) return;
  document.getElementById('fontSizeLabel').textContent = this.value;
  clearTimeout(fontSizeTimer);
  fontSizeTimer = setTimeout(() => {
    api('/setfontsize', { method: 'POST', body: String(this.value) }).catch(() => {});
  }, 150);
});

let opacityLocked = true;
function toggleOpacityLock() {
  opacityLocked = !opacityLocked;
  const slider = document.getElementById('opacitySlider');
  const btn = document.getElementById('opacityLockBtn');
  slider.disabled = opacityLocked;
  btn.textContent = opacityLocked ? '🔒' : '🔓';
}

let opacityTimer = null;
document.getElementById('opacitySlider').addEventListener('change', function() {
  if (opacityLocked) return;
  api('/setopacity', { method: 'POST', body: String(this.value) }).catch(() => {});
});
document.getElementById('opacitySlider').addEventListener('input', function() {
  if (opacityLocked) return;
  document.getElementById('opacityLabel').textContent = Math.round(this.value / 250 * 100) + '%';
  clearTimeout(opacityTimer);
  opacityTimer = setTimeout(() => {
    api('/setopacity', { method: 'POST', body: String(this.value) }).catch(() => {});
  }, 150);
});

function fmtTime(sec) {
  const neg = sec < 0;
  if (neg) sec = -sec;
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return (neg ? '-' : '') + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

function setTitleDisabled(id, disabled) {
  const el = document.getElementById(id);
  if (!el.getAttribute('data-base')) el.setAttribute('data-base', el.textContent);
  const base = el.getAttribute('data-base');
  el.textContent = disabled ? base + '（已禁用）' : base;
}

function getStateLabel(state) {
  switch (state) {
    case '运行中': return { text: 'RUNNING', cls: 'running' };
    case '已暂停': return { text: 'PAUSED', cls: 'paused' };
    default: return { text: state, cls: '' };
  }
}

function updateStatus() {
  api('/status').then(r => r.json()).then(data => {
    lastStatus = data;
    hideLogin();
    document.getElementById('disconnectBanner').style.display = 'none';

    const badge = getStateLabel(data.state);
    document.getElementById('stateBadge').textContent = badge.text;
    document.getElementById('stateBadge').className = 'state-badge ' + badge.cls;
    document.getElementById('timeDisplay').textContent = fmtTime(data.seconds);
    // 进度条
    const pct = data.totalSeconds > 0 ? (data.seconds / data.totalSeconds * 100) : 0;
    const fill = document.getElementById('progressFill');
    const p = Math.max(0, pct);
    fill.style.width = p + '%';
    // 纯黑白：进度剩余 > 40% 黑色，<= 40% 黑色（保持黑白风格，去掉红色）
    document.getElementById('progressText').textContent = Math.round(p) + '%';
    const toggle = document.getElementById('btnToggle');
    toggle.textContent = data.isRunning ? '暂停' : '启动';
    toggle.className = 'btn ' + (data.isRunning ? '' : 'btn-start');
    document.getElementById('chkShowTimer').checked = data.showTimer;
    document.getElementById('chkFlash3').checked = data.flash3;
    document.getElementById('chkSound').checked = data.sound;
    document.getElementById('chkPptAuto').checked = data.pptAuto;
    document.getElementById('chkSlideInfo').checked = data.showSlideInfo;
    document.getElementById('chkAllowNegative').checked = data.allowNegative;
    document.getElementById('chkPureSlide').checked = data.pureSlide;

    // 纯PPT页数模式：隐藏时间、时间设置、控制按钮
    const pureSlide = data.pureSlide;
    document.getElementById('timerMainArea').style.display = pureSlide ? 'none' : '';
    document.getElementById('timeSettingCard').style.display = pureSlide ? 'none' : '';
    document.getElementById('controlsCard').style.display = pureSlide ? 'none' : '';

    // 幻灯片页数 + 正向进度
    const slideRow = document.getElementById('slideInfoRow');
    if (data.slideInfo) {
      document.getElementById('slideInfoText').textContent = 'P' + data.slideInfo;
      slideRow.style.display = '';
      const parts = data.slideInfo.split('/');
      if (parts.length === 2) {
        const cur = parseInt(parts[0]), tot = parseInt(parts[1]);
        if (tot > 0 && cur > 0) {
          const pct = Math.round(cur / tot * 100);
          document.getElementById('slideProgressFill').style.width = pct + '%';
          document.getElementById('slideProgressText').textContent = pct + '%';
        } else {
          document.getElementById('slideProgressFill').style.width = '0%';
          document.getElementById('slideProgressText').textContent = '--';
        }
      }
    } else {
      slideRow.style.display = pureSlide ? '' : 'none';
      if (pureSlide) {
        document.getElementById('slideInfoText').textContent = '未获取到页数';
        document.getElementById('slideProgressFill').style.width = '0%';
        document.getElementById('slideProgressText').textContent = '--';
      }
    }

    const canTime = data.setTime === 1;
    document.getElementById('inputMinutes').disabled = !canTime;
    document.getElementById('btnSetTime').disabled = !canTime;
    document.querySelectorAll('#presetRow .preset-btn').forEach(b => b.disabled = !canTime);
    setTitleDisabled('titleTimeSetting', !canTime);

    const canControl = data.startPauseReset === 1;
    document.getElementById('btnToggle').disabled = !canControl;
    document.getElementById('btnReset').disabled = !canControl;
    setTitleDisabled('titleControls', !canControl);

    const canWindow = data.permWindow === 1;
    ['btnPosLeftTop', 'btnPosTopCenter', 'btnPosRightTop', 'btnMoveUp', 'btnMoveDown', 'btnMoveLeft', 'btnMoveRight', 'btnCycleScreen'].forEach(id => {
      document.getElementById(id).disabled = !canWindow;
    });
    setTitleDisabled('titleWindow', !canWindow);

    const canAppearance = data.permAppearance === 1;
    document.getElementById('opacitySlider').disabled = !canAppearance || opacityLocked;
    document.getElementById('fontSizeSlider').disabled = !canAppearance || fontSizeLocked;
    document.getElementById('opacityLockBtn').disabled = !canAppearance;
    document.getElementById('fontSizeLockBtn').disabled = !canAppearance;
    setTitleDisabled('titleOpacity', !canAppearance);
    setTitleDisabled('titleFontSize', !canAppearance);

    const canFlashSound = data.permFlashSound === 1;
    document.getElementById('btnFlash').disabled = !canFlashSound;
    document.getElementById('btnTestSound').disabled = !canFlashSound;
    setTitleDisabled('titleFlashSound', !canFlashSound);

    const canSettings = data.permSettings === 1;
    ['chkShowTimer', 'chkFlash3', 'chkSound', 'chkPptAuto', 'chkSlideInfo', 'chkAllowNegative', 'chkPureSlide'].forEach(id => {
      document.getElementById(id).disabled = !canSettings;
    });
    setTitleDisabled('titleSettings', !canSettings);

    document.getElementById('opacitySlider').value = data.opacity;
    document.getElementById('opacityLabel').textContent = Math.round(data.opacity / 250 * 100) + '%';

    document.getElementById('fontSizeSlider').value = data.fontSize;
    document.getElementById('fontSizeLabel').textContent = data.fontSize;

    // 多屏切换按钮
    var btnScreen = document.getElementById('btnCycleScreen');
    var screenInfo = document.getElementById('screenInfo');
    if (data.screenCount > 1) {
      btnScreen.style.display = '';
      screenInfo.textContent = data.screenIndex + '/' + data.screenCount;
    } else {
      btnScreen.style.display = 'none';
    }

    const canPresentation = data.permPresentation === 1;
    document.getElementById('btnStartShow').disabled = !canPresentation;
    document.getElementById('btnCloseShow').disabled = !canPresentation;
    setTitleDisabled('titlePresentation', !canPresentation);

    const presenterMenuItem = document.getElementById('menuPresenter');
    presenterMenuItem.disabled = !canPresentation;
    presenterMenuItem.textContent = canPresentation ? '翻页笔' : '翻页笔（已禁用）';

    const canDocPreview = data.permDocPreview === 1;
    const docMenuItem = document.getElementById('menuDocPreview');
    docMenuItem.disabled = !canDocPreview;
    docMenuItem.textContent = canDocPreview ? '文档预览' : '文档预览（已禁用）';

    // 前台应用信息
    document.getElementById('fgInfo').textContent = data.foregroundInfo || '-';
  }).catch(e => {
    if (e && e.auth) return;
    document.getElementById('disconnectBanner').style.display = 'flex';
  });
}

function initStatus() {
  api('/status').then(r => r.json()).then(data => {
    document.getElementById('inputMinutes').value = data.minutes;
  }).catch(() => {});
}

if (authRequired) showLogin();

setInterval(updateStatus, 1000);
initStatus();
updateStatus();
</script>
</body>
</html>
